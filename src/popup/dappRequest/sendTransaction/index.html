<div class="sign-transaction">
    <div class="header flex">
        <div class="sign-address">
            <p>自</p>
            <p>{{currentWallt?.userName}}</p>
        </div>
		<p>></p>
        <div class="sign-address">
            <p>至</p>
            <p>{{toAddress || '--'}}</p>
        </div>
    </div>
	<div class="sign-network mt-20">
		<div class="flex">
			<p>网络</p>
			<p>{{rpc_url?.url}}</p>
		</div>
		<div class="flex">
			<p>请求来自</p>
			<p>{{sendTransaction?.currentOrigin}}</p>
		</div>
	</div>
	<div class="sign-network mt-20">
		<div class="flex">
			<p>网络费</p>
			<p>{{gasPrice}}{{rpc_url?.unit}}</p>
		</div>
		<div class="flex">
			<p>最大费用</p>
			<p>{{gasPrice}}</p>
		</div>
	</div>
	<div class="sign-network mt-20">
		<div class="flex">
			<p>交易唯一标识号</p>
			<p>{{Number(sendTransaction?.nonce)}}</p>
		</div>
	</div>
    <div class="actions mt-20">
        <button @click="reject" class="reject">拒绝</button>
        <button @click="sign" class="sign">确认签名</button>
    </div>
</div>
